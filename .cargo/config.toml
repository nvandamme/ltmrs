[alias]
xtask = "run --quiet -p xtask --"

# NOTE: fast-linker selection lives in each member's build.rs (shared
# probe at tools/detect_linker.rs), not here: cargo has no conditional
# config, and a hardcoded -fuse-ld breaks checkouts without that linker.
# Override per-build with LTMRS_LINKER=mold|wild|system.

# NOTE: no committed [build] rustc-wrapper (2026-11-13): cargo has no
# per-platform config — a committed wrapper is mandatory on ALL hosts.
# A committed .sh wrapper cannot exec on Windows (os error 193), and a
# .cmd shim corrupts rustc's quoted --cfg args (cmd %* collapses escaped
# quotes: windows-sys E0554). Per-build opt-in is Windows-safe: plain
# RUSTC_WRAPPER=sccache passes rustc probes (--version, -vV, --print)
# through verbatim and compiles windows-sys clean (verified 2026-11-14,
# sccache 0.19). POSIX opt-in is the repo wrapper:
#   export RUSTC_WRAPPER="$PWD/tools/sccache-wrap.sh"
# (direnv/.envrc or CI script). Unset by default: plain rustc, zero
# config, zero flake surface on any host.
