[package]
name = "ltmrs"
# Pre-release per §2.3: the useful vertical slice ships as v0.1-alpha;
# the full v0.1 compatibility release stays gated. (Skill recipe versions
# are independent dotted numerics; see ltmrs-frontend's skills::installer::SKILL_VERSION.)
version = "0.1.0-alpha"
edition = "2024"
description = "Local MCP memory service for LLM agents (Lemma 0.21.0 API/workflow target; compatibility gated on release qualification)."
license = "MIT OR Apache-2.0"

# WP-00 candidate dependency set (AD-02). Pinned for the backend comparison
# (WP-02). CPU-first, offline-capable: no GPU features, no cloud features.
# See baseline/lemma-0.21.0/dependency-native-audit.md for the native-code audit.
[dependencies]
# No direct getrandom pin: the per-boot visualizer token uses uuid v4
# (OS-seeded CSPRNG via rand), so randomness rides the already-direct uuid
# edge instead of a single-use pin. DefaultHasher is NOT a substitute
# (fixed keys, brute-forceable from /proc + port scan).

# OS-level primitives: singleton lock (flock), socket/permission control.
libc = "0.2"

# Core async runtime + utilities.
tokio = { version = "1", features = ["rt-multi-thread", "rt", "macros", "io-util", "io-std", "net", "signal", "time", "sync"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: legacy wire objects (e.g. memory_stats by_source/by_project)
# must serialize in upstream insertion order, not BTreeMap-alphabetical.
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
sha2 = "0.11"

ltmrs-domain = { path = "crates/domain" }
ltmrs-service = { path = "crates/service" }
ltmrs-compat = { path = "crates/compat" }
ltmrs-embeddings = { path = "crates/embeddings" }
ltmrs-search = { path = "crates/search" }
ltmrs-interchange = { path = "crates/interchange" }
ltmrs-daemon = { path = "crates/daemon" }
ltmrs-frontend = { path = "crates/frontend" }

[dev-dependencies]
tempfile = "3"
# Test-only tokio features: `test-util` enables #[tokio::test(start_paused)] for
# deterministic, fast interval/scheduling tests (no real-time sleeps).
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dev-dependencies]
# Test-only: TerminateProcess by pid (visualizer smoke stop) and the
# daemon's graceful Ctrl-Break test shape (T-DAEMON lifecycle, Windows).
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

# Release-grade optimization on both profiles (v0.1-alpha decision):
# Dev profile is tuned for iteration speed, not runtime: no LTO
# (thin-LTO costs minutes per test link on the candle/lance tree),
# line-tables-only debuginfo (fast links, usable backtraces), and
# extra codegen units for many-core machines. Release keeps thin LTO.
[profile.dev]
lto = false
debug = 1
codegen-units = 64

[profile.release]
lto = "thin"

[workspace]
resolver = "2"
members = [".", "crates/domain", "crates/service", "crates/compat", "crates/embeddings", "crates/search", "crates/interchange", "crates/daemon", "crates/frontend", "xtask"]
