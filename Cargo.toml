[package]
name = "ltmrs"
# Pre-release per §2.3: the useful vertical slice ships as v0.1-alpha;
# the full v0.1 compatibility release stays gated. (Skill recipe versions
# are independent dotted numerics; see skills::installer::SKILL_VERSION.)
version = "0.1.0-alpha"
edition = "2024"
description = "Local MCP memory service for LLM agents (Lemma 0.21.0 API/workflow target; compatibility gated on release qualification)."
license = "MIT OR Apache-2.0"

# WP-00 candidate dependency set (AD-02). Pinned for the backend comparison
# (WP-02). CPU-first, offline-capable: no GPU features, no cloud features.
# See baseline/lemma-0.21.0/dependency-native-audit.md for the native-code audit.
[dependencies]
# MCP protocol (frontend stdio boundary + daemon dispatcher).
# server feature gives the stdio/async-rw transports; avoid auth/reqwest (C code).
rmcp = { version = "3.4.0", default-features = false, features = ["server", "transport-async-rw", "transport-io"] }

# Candidate A: LanceDB canonical + retrieval (Lance engine).
# default-features=false: no cloud/object-store/GPU. zstd (C) is unavoidable.
# NOTE (WP-00 finding): lancedb 0.38.0 does not compile without `remote` —
# `pub mod job` is unconditional but `Error::Http` is `remote`-gated. Enabling
# `remote` pulls reqwest/http/urlencoding (unused in local mode). See
# baseline/lemma-0.21.0/dependency-native-audit.md.
lancedb = { version = "0.39.0", default-features = false, features = ["remote"] }
lance = { version = "12.0.0", default-features = false }

# Candidate B: Fjall canonical KV (pure Rust, no native deps).
fjall = { version = "3.1.10" }

# Candle embeddings (CPU). default features = CPU baseline; onig_sys (C) is a
# hard transitive dep via tokenizers. Do NOT enable cuda/metal/mkl.
# NOTE: candle-transformers is intentionally NOT a dependency — E5 uses the
# local bert_impl (avoids its position-embedding bug); pulling the crate
# would add an unused dep to the graph.
candle-core = { version = "0.11.0" }
candle-nn = { version = "0.11.0" }
# Match candle-core 0.11.0's tokenizers to avoid a duplicate version in the graph.
tokenizers = { version = "0.22.2" }

# Artifact fetch (model downloads). rustls-tls only — pure Rust, no native TLS.
# Already in the graph via lancedb `remote`; making it explicit keeps RQ-21 honest.
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }

# OS CSPRNG for the per-boot visualizer access token (no std equivalent;
# DefaultHasher has fixed keys and is brute-forceable from /proc + port scan).
getrandom = "0.4"

# OS-level primitives: singleton lock (flock), socket/permission control.
libc = "0.2"

# Core async runtime + utilities.
tokio = { version = "1", features = ["rt-multi-thread", "rt", "macros", "io-util", "io-std", "net", "signal", "time", "sync", "process"] }
serde = { version = "1", features = ["derive"] }
# preserve_order: legacy wire objects (e.g. memory_stats by_source/by_project)
# must serialize in upstream insertion order, not BTreeMap-alphabetical.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tracing = "0.1"
uuid = { version = "1", features = ["v5", "v7", "serde"] }
sha2 = "0.11"
# Best-effort secret detection for memory_add privacy (design 12.1).
regex = { version = "1", default-features = false, features = ["std"] }

# Arrow (behind storage/ only). Pinned to the lance/lancedb ecosystem line:
# lance 12 + lancedb 0.39 + datafusion 54.1 all resolve arrow 58, so a
# direct 60 pin would fork arrow_array/arrow_schema in our own calls.
arrow-array = "58"
arrow-schema = "58"
arrow-buffer = "58"
lance-index = { version = "12", default-features = false }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
# Test-only tokio features: `test-util` enables #[tokio::test(start_paused)] for
# deterministic, fast interval/scheduling tests (no real-time sleeps).
tokio = { version = "1", features = ["test-util"] }

# Release-grade optimization on both profiles (v0.1-alpha decision):
# thin LTO trades link time (notably slower dev/test cycles) for
# optimized codegen; measured +1.3% binary size on this tree, so no
# size claim is made — runtime delta unmeasured, keep or revert on call.
[profile.dev]
lto = "thin"

[profile.release]
lto = "thin"
