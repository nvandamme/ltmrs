# benchmarks.toml — versioned workload specifications for WP-12 experiments.
#
# Each [[workload]] is a seed-pinned workload the src/bench harness executes
# deterministically (same seed ⇒ same op stream and probe vectors). This file
# specifies workloads only; it carries no results. Raw evidence (JSONL
# histories + JSON summaries with provenance) lives under reports/<name>/
# (gitignored) and is produced by `cargo test -- --ignored
# storage_experiment_reference_run` (and later runners). Only workloads with
# real evidence are listed here — no aspirations.

harness_version = 3

# Test-harness env (deliberately NOT CLI flags): these gate #[ignore]d
# reference/evidence runs and report labels only — never production paths.
# CLI-first applies to operator surfaces; test selection stays env-gated
# (cargo convention: env selects ignored tests, flags would pollute help).
# - LTMRS_BENCH_MACHINE: machine label in reference-run reports (default dev-box).
# - LTMRS_PROBE_MODELS: provisioned models dir; gates quality/BEIR reference runs (SKIP without).
# - LTMRS_BEIR_DIR: BEIR corpus dir; gates the full BEIR run with PROBE_MODELS.

[[workload]]
name = "wp12-storage-01"
description = "Storage-only baseline: Fjall canonical put/get plus Lance FTS lexical search over embedding-free rows. No model inference inside the measured boundary."
seed = 7
ops = 2000
puts_per_1000 = 600
key_space = 500
value_bytes = 256
top_k = 10
backends = ["fjall-canonical", "lance-fts"]
evidence = "reports/wp12-storage-01/"

[[workload]]
name = "wp12-load-01"
description = "Load legs over the same put/get stream (seed 11, 1000 ops, 600 puts/1000, key space 500): closed-loop with 4 workers plus open-loop Poisson 200/s arrivals with 2 workers, per-op queue time measured from scheduled arrival. Search ops skipped (single-threaded FTS leg only)."
seed = 11
ops = 1000
puts_per_1000 = 600
key_space = 500
value_bytes = 256
top_k = 10
backends = ["fjall-canonical"]
evidence = "reports/wp12-load-01/"

# Cross-implementation comparisons reference a workload stream above and
# record both sides' evidence plus per-op-kind comparability verdicts.
# A verdict of NOT COMPARABLE with a named reason is a result, not a gap.

[[comparison]]
name = "wp12-lemma-01"
stream = "wp12-storage-01"
sides = ["ltmrs", "lemma-0.21.0"]
evidence = "reports/wp12-lemma-01/"
verdict = "put/search not comparable (dedup-gate refusal cascade diverged the corpus); get miss-latency comparable as operation shape only (811us vs 32us p50, error-vs-ok semantics differ)"

# Explicit not_run ledger (plan acceptance: unrun tests are `not_run` with a
# named reason, never zero-filled or silently omitted).
# Tail percentiles in executed summaries carry an indicative-only note below
# TAIL_SAMPLE_FLOOR (see OpStats.note); they are not strong evidence.

[[executed]]
name = "fault-soak-skeleton"
evidence = "reports/wp12-soak-01/ (summary-soak.json + history-seg-{0..3}.jsonl)"
detail = "Executed 2026-11-12: ignored runner soak_reference_run (seed 21, 400/300 put/RMW per 1000, 900/1000 hot into 8 keys, key space 64, 4 segments x 500 ops = 2000 ops, 4 workers, 13.2s with drop+reopen restart accounting between segments); 0 failures, 94 conflicts = 94 retries (every conflict exactly one retry); steady-state signal ~947 B/op first-to-last (indicative only, LSM layout noise dominates at small segment counts). Full clock-time soak, sustained racing-write consistency, fault-injection-under-load, tail-latency-under-load, and SIGKILL/power-loss runs stay not_run (machine-gated; see remaining legs below)."
[[superseded]]
name = "quality-corpus-300"
superseded_by = "beir-scifact-full"
reason = "Owner decision 2026-11-12: the human-reviewed 300-case target (§8.1) is met by BEIR SciFact human test qrels (300/340 judged queries over 5,183 real docs) instead of a bespoke review effort. The synthetic 300-case corpus (experiments/quality/retrieval-calibration.json) stays as the dev/heldout calibration instrument (threshold sweeps, ANN distribution probes); BEIR is the quality gate. A derived corpus mined from live session feedback was considered and rejected — it would manufacture ground truth."
[[executed]]
name = "ablation-graph-upstream"
evidence = "ignored test graph_snapshot_expansion_lift (lancedb-free, real staged edges from tmp/live-lemma/graph-probe.json)"
detail = "Graph half executed 2026-11-12: `snapshot_expansion_lift` loads 4720 real staged edges (uuid5-mapped from the live lemma snapshot, no synthesis) and runs the production `expand` from the 20 highest-degree hubs under the default policy — mean 17.8 nodes reached vs 1.0 relation-agnostic, 100% truncation (default budget binds on every real hub: max_nodes 24 caps genuine fanout, a tuning signal not a failure). Machinery comparison on real edge distributions, never a recall claim (no query cases with known answers). Frozen-corpus Graph leg stays unlanded by design (no edges to ablate over); UpstreamReference half executed 2026-11-13: `upstream_reference_report` runs the live Lemma FTS SQL shape (memory_fts MATCH + bm25 + project filter, LIKE fallback) via the sqlite3 CLI against a lemma-shaped store built from the frozen safety corpus — no rusqlite edge, no port. Safety corpus: Dev recall 0.750 ndcg 0.704 (8 cases), Heldout 1.000/1.000 (2 cases); leakage REPORTED not gated (their query shape has no must_exclude concept). Strategy comparison, not a quality bar."
[[executed]]
name = "ann-vs-exact"
evidence = "ignored test ann_ivf_pq_clustered_distribution_recall (lancedb 0.40, Cosine, 8 partitions)"
detail = "Two measured points 2026-10-26 + 2026-11-12: (1) uniform-random floor — 10k unit-norm 384-d xorshift vectors, IVF-PQ defaults, Recall@10 0.176 unfiltered / 0.145 filtered, freshness PASS, build 21.9s (adversarial: distances concentrate, no cluster structure). (2) clustered distribution — 300 real E5-small embeddings of the topic-disjoint fixture, 8 partitions, Recall@10 mean 0.875 min 0.700 (n=300), build 2.6s. Verdict: the floor was distributional, not structural — IVF-PQ is viable on realistic E5 distributions with tuned partitions. Scale-limited (300/10k vs 100k §8.3 target) + no human labels: T-QUALITY-02 stays not_run-with-partial-evidence, never passed."
[[executed]]
name = "beir-scifact-full"
evidence = "ignored test beir_scifact_hybrid_quality, release profile, LTMRS_BEIR_DIR=tmp/beir-scifact/scifact-709r"
detail = "Executed 2026-11-12: 709-doc coverage slice (all 283 qrel-referenced docs + 426 fill; all 300 test queries fully covered) in release profile, 362s. Hybrid retrieval at production default: nDCG@10 0.852, MAP 0.817, Recall@100 0.948, MRR@10 0.826 on human test qrels. Debug-profile full-corpus attempt killed after 2h with no output (rule: slow tests run release-only — debug E5 forwards ~5s/doc make 5,183 docs a ~7h run; release ~6min for 709). Full 5,183-doc overnight run remains open as a scale confirmation, not a gate: this slice already measures the production path on human judgments."
[[executed]]
name = "contended-write-mix"
evidence = "reports/wp12-contended-write/ (summary.json + history.jsonl + contention.json)"
detail = "Executed 2026-11-12: ignored runner contended_write_mix_reference_run (seed 7, 500/500 put/RMW, 900/1000 hot into 4 keys, 2000 ops, 4 workers, 15.2s); 0 failures, 398 conflicts = 398 retries (every conflict exactly one retry); put p50 15.6ms (includes SyncAll barrier per write). Harness landed 2026-11-11 (RMW hot-skew + revision-checked path + OpOutcome counters; unit test contended_write_mix_runs_closed_loop green)."

[[executed]]
name = "search-load-legs"
evidence = "reports/wp12-search-load/ (summary.json + history.jsonl)"
detail = "Executed 2026-11-12: ignored runner search_load_reference_run (seed 11 family, 200-op box-sized stream — the 1000-op stream exceeds interactive bulk-index time; 4 workers, 0.83s); 39 search ops, 0 failures, search p50 2.9ms. Harness landed 2026-11-11 (shared &SearchTable, per-thread runtimes, fts_index_ready gate; unit test threaded_search_matches_single_thread green)."

[[executed]]
name = "lemma-unique-content-variant"
evidence = "reports/wp12-lemma-salted/ (ops.jsonl + upstream-transcript.jsonl + comparison.json)"
detail = "Executed + corrected 2026-11-12: salted stream (seed 7, 2000 ops: 1217 puts / 397 gets / 386 searches) against pinned upstream lemma-mcp@0.21.0 (global install dist, scratch HOME). First run used a gate-invisible numeric trailer (769 refusals; constant words + filtered digit score 1.0 always) — corrected to a wordlist triple salt (salt_words, 64-word list, xorshift taps), re-run: 742/1217 puts admitted, 475 refused with rate climbing 18%->51% by quartile as the 500-key corpus densifies. Upstream gate read from code: findSimilarByText (core.js:778), score = overlap/|query len>1 words|, refuse at >=0.80. Verdict: put NOT COMPARABLE (gate collapses same-key repeats by design; measures gate behavior, not write throughput). All 185 get failures are unmapped-get cascade. Driver rmw-kind mapping landed (memory_update on tracked id, live probes green). Follow-up CLOSED (would need upstream gate controls)."
