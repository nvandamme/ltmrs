# benchmarks.toml — versioned workload specifications for WP-12 experiments.
#
# Each [[workload]] is a seed-pinned workload the src/bench harness executes
# deterministically (same seed ⇒ same op stream and probe vectors). This file
# specifies workloads only; it carries no results. Raw evidence (JSONL
# histories + JSON summaries with provenance) lives under reports/<name>/
# (gitignored) and is produced by `cargo test -- --ignored
# storage_experiment_reference_run` (and later runners). Only workloads with
# real evidence are listed here — no aspirations.

harness_version = 3

# Test-harness env (deliberately NOT CLI flags): these gate #[ignore]d
# reference/evidence runs and report labels only — never production paths.
# CLI-first applies to operator surfaces; test selection stays env-gated
# (cargo convention: env selects ignored tests, flags would pollute help).
# - LTMRS_BENCH_MACHINE: machine label in reference-run reports (default dev-box).
# - LTMRS_PROBE_MODELS: provisioned models dir; gates quality/BEIR reference runs (SKIP without).
# - LTMRS_BEIR_DIR: BEIR corpus dir; gates the full BEIR run with PROBE_MODELS.

[[workload]]
name = "wp12-storage-01"
description = "Storage-only baseline: Fjall canonical put/get plus Lance FTS lexical search over embedding-free rows. No model inference inside the measured boundary."
seed = 7
ops = 2000
puts_per_1000 = 600
key_space = 500
value_bytes = 256
top_k = 10
backends = ["fjall-canonical", "lance-fts"]
evidence = "reports/wp12-storage-01/"

[[workload]]
name = "wp12-load-01"
description = "Load legs over the same put/get stream (seed 11, 1000 ops, 600 puts/1000, key space 500): closed-loop with 4 workers plus open-loop Poisson 200/s arrivals with 2 workers, per-op queue time measured from scheduled arrival. Search ops skipped (single-threaded FTS leg only)."
seed = 11
ops = 1000
puts_per_1000 = 600
key_space = 500
value_bytes = 256
top_k = 10
backends = ["fjall-canonical"]
evidence = "reports/wp12-load-01/"

# Cross-implementation comparisons reference a workload stream above and
# record both sides' evidence plus per-op-kind comparability verdicts.
# A verdict of NOT COMPARABLE with a named reason is a result, not a gap.

[[comparison]]
name = "wp12-lemma-01"
stream = "wp12-storage-01"
sides = ["ltmrs", "lemma-0.21.0"]
evidence = "reports/wp12-lemma-01/"
verdict = "put/search not comparable (dedup-gate refusal cascade diverged the corpus); get miss-latency comparable as operation shape only (811us vs 32us p50, error-vs-ok semantics differ)"

# Explicit not_run ledger (plan acceptance: unrun tests are `not_run` with a
# named reason, never zero-filled or silently omitted).
# Tail percentiles in executed summaries carry an indicative-only note below
# TAIL_SAMPLE_FLOOR (see OpStats.note); they are not strong evidence.

[[executed]]
name = "fault-soak-skeleton"
evidence = "reports/wp12-soak-01/ (summary-soak.json + history-seg-{0..3}.jsonl)"
detail = "Executed 2026-11-12: ignored runner soak_reference_run (seed 21, 400/300 put/RMW per 1000, 900/1000 hot into 8 keys, key space 64, 4 segments x 500 ops = 2000 ops, 4 workers, 13.2s with drop+reopen restart accounting between segments); 0 failures, 94 conflicts = 94 retries (every conflict exactly one retry); steady-state signal ~947 B/op first-to-last (indicative only, LSM layout noise dominates at small segment counts). Full clock-time soak, sustained racing-write consistency, fault-injection-under-load, tail-latency-under-load, and SIGKILL/power-loss runs stay not_run (machine-gated; see remaining legs below)."
[[not_run]]
name = "quality-corpus-300"
reason = "Human-reviewed corpus target (§8.1, ≥300 cases) not built; a synthetic 300-case known-answer corpus (topic-disjoint dev/heldout, paraphrase queries) is built and executed instead — experiments/quality/retrieval-calibration.json. The 10-case safety fixture pins mechanics, not retrieval quality."

[[not_run]]
name = "ablation-graph-upstream"
reason = "DenseExact/HybridRrf/Priority/Mmr legs landed 2026-11-11 (src/bench/quality/ablation.rs + ablation_tests.rs, 14/14 quality green, zero leakage on frozen corpus). Graph leg blocked: frozen corpus carries no relation edges and synthesizing them would leak answers. UpstreamReference blocked on owner decision (TF-IDF port vs provisioned upstream). Neither zero-filled."

[[not_run]]
name = "ann-vs-exact"
reason = "No ANN index configuration evaluated (§8.3 orders exact search first; T-QUALITY-02)."
[[not_run]]
name = "beir-scifact-full"
reason = "Harness built and proven through 709 real indexed docs (ignored test beir_scifact_hybrid_quality; needs LTMRS_PROBE_MODELS + LTMRS_BEIR_DIR). Full 5,183-doc run needs ~5h CPU single-threaded bulk indexing (~4s/job measured: multi-chunk candle forwards + per-job Lance commits); run on a GPU-backed or unattended box, not interactively."

[[executed]]
name = "contended-write-mix"
evidence = "reports/wp12-contended-write/ (summary.json + history.jsonl + contention.json)"
detail = "Executed 2026-11-12: ignored runner contended_write_mix_reference_run (seed 7, 500/500 put/RMW, 900/1000 hot into 4 keys, 2000 ops, 4 workers, 15.2s); 0 failures, 398 conflicts = 398 retries (every conflict exactly one retry); put p50 15.6ms (includes SyncAll barrier per write). Harness landed 2026-11-11 (RMW hot-skew + revision-checked path + OpOutcome counters; unit test contended_write_mix_runs_closed_loop green)."

[[executed]]
name = "search-load-legs"
evidence = "reports/wp12-search-load/ (summary.json + history.jsonl)"
detail = "Executed 2026-11-12: ignored runner search_load_reference_run (seed 11 family, 200-op box-sized stream — the 1000-op stream exceeds interactive bulk-index time; 4 workers, 0.83s); 39 search ops, 0 failures, search p50 2.9ms. Harness landed 2026-11-11 (shared &SearchTable, per-thread runtimes, fts_index_ready gate; unit test threaded_search_matches_single_thread green)."

[[executed]]
name = "lemma-unique-content-variant"
evidence = "reports/wp12-lemma-salted/ (ops.jsonl + upstream-transcript.jsonl + comparison.json)"
detail = "Executed 2026-11-12: salted stream (seed 7, 2000 ops: 1217 puts all salted, 397 gets, 386 searches) against pinned upstream lemma-mcp@0.21.0 (global install dist, scratch HOME, 13.2s). Verdict: put NOT COMPARABLE — 769/1217 puts refused ('A similar memory already exists'); salt defeats byte-identity dedup, not a similarity gate. ltmrs put is key-addressed blind upsert (no content gate). Driver rmw-kind mapping landed (memory_update on tracked id, 2-op live probe green). Follow-up CLOSED (would need upstream dedup-gate controls)."
