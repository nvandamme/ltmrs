[package]
name = "ltmrs-interchange"
version = "0.1.0-alpha"
edition = "2024"

[dependencies]
ltmrs-domain = { path = "../domain" }
ltmrs-service = { path = "../service" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"
sha2 = "0.11"
