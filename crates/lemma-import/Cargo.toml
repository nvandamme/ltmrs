[package]
name = "ltmrs-lemma-import"
version = "0.1.0-alpha"
edition = "2024"
description = "Isolated Lemma .lemma-backup importer (cdylib; owns the only rusqlite edge)."
license = "MIT OR Apache-2.0"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
ltmrs-domain = { path = "../domain" }
rusqlite = { version = "0.41", features = ["bundled"] }
base64 = { version = "0.23" }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
sha2 = { version = "0.11" }
tempfile = "3.0"
uuid = { version = "1.0", features = ["v5", "serde"] }

[dev-dependencies]
tempfile = "3.0"
rusqlite = { version = "0.41", features = ["bundled", "serialize"] }
base64 = { version = "0.23" }
serde_json = { version = "1.0" }
sha2 = { version = "0.11" }
