[package]
name = "ltmrs-daemon"
version = "0.1.0-alpha"
edition = "2024"

[dependencies]
ltmrs-domain = { path = "../domain" }
ltmrs-service = { path = "../service" }
ltmrs-compat = { path = "../compat" }
ltmrs-embeddings = { path = "../embeddings" }
ltmrs-search = { path = "../search" }
ltmrs-interchange = { path = "../interchange" }
tokio = { version = "1", features = ["rt-multi-thread", "rt", "macros", "net", "io-util", "io-std", "sync", "time"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
sha2 = "0.11"
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_SystemServices",
    "Win32_System_Threading",
] }
tokio = { version = "1", features = ["test-util"] }
regex = { version = "1", default-features = false, features = ["std", "unicode-case", "unicode-perl"] }
