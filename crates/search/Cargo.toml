[package]
name = "ltmrs-search"
version = "0.1.0-alpha"
edition = "2024"

[dependencies]
ltmrs-domain = { path = "../domain" }
ltmrs-service = { path = "../service" }
ltmrs-embeddings = { path = "../embeddings" }
lancedb = { version = "0.39.0", default-features = false, features = ["remote"] }
lance-index = { version = "12", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "rt", "macros", "sync", "time"] }
serde = { version = "1", features = ["derive"] }
uuid = { version = "1", features = ["v4", "v5", "v7", "serde"] }
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["test-util"] }
