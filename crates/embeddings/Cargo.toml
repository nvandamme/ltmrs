[package]
name = "ltmrs-embeddings"
version = "0.1.0-alpha"
edition = "2024"

[dependencies]
ltmrs-domain = { path = "../domain" }
candle-core = { version = "0.11" }
candle-nn = { version = "0.11" }
tokenizers = { version = "0.22" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "rt", "macros", "sync", "time"] }
tracing = "0.1"
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3.0"
ltmrs-search = { path = "../search" }

[features]
# RQ-09/RQ-10 GPU leg (WP-06): opt-in CUDA inference. Production default
# stays CPU (see E5SmallAdapter::load_verified); the CUDA path is only
# reachable via the explicit load_verified_on_device constructor below.
# Mirrors the existing candle pins exactly (0.11, caret style).
cuda = ["candle-core/cuda", "candle-nn/cuda"]
