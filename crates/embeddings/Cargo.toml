[package]
name = "ltmrs-embeddings"
version = "0.1.0-alpha"
edition = "2024"

[dependencies]
ltmrs-domain = { path = "../domain" }
burn-tensor = { version = "0.22" }
burn-nn = { version = "0.22" }
burn-core = { version = "0.22" }
burn-dispatch = { version = "0.22", features = ["flex"] }
# CubeCL CUDA runtime (dynamic loading only via fallback-dynamic-loading;
# zero link-time CUDA — Task 6 gates this). Enabled only under `cuda`.
burn-cubecl = { version = "0.22", optional = true }
# Direct cudarc pin: runtime loader probe (`is_culib_present`) only.
# Dynamic loading exclusively (fallback-dynamic-loading) — the Task 6 gate
# and `cargo tree -e features` forbid dynamic-linking/static-linking.
cudarc = { version = "0.19", optional = true, default-features = false, features = [
    "driver",
    "std",
    "fallback-dynamic-loading",
] }
burn-flex = { version = "0.22" }
safetensors = { version = "0.4" }
half = { version = "2.7", default-features = false }
tokenizers = { version = "0.22" }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1.0", features = ["rt-multi-thread", "rt", "macros", "sync", "time"] }
tracing = "0.1"
serde_json = { version = "1.0", features = ["preserve_order"] }
thiserror = "2.0"
sha2 = "0.11"

[dev-dependencies]
tempfile = "3.0"
ltmrs-search = { path = "../search" }

[features]
# RQ-09/RQ-10 GPU leg (WP-06): opt-in CUDA inference. Production default
# stays CPU (see E5SmallAdapter::load_verified); the CUDA path is only
# reachable via the explicit load_verified_on_device constructor below.
# Burn CubeCL CUDA runtime (dynamic loading only via fallback-dynamic-loading).
cuda = ["burn-dispatch/cuda", "burn-cubecl/cuda", "dep:burn-cubecl", "dep:cudarc"]
